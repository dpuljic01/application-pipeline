name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_pipeline_user
          POSTGRES_PASSWORD: app_pipeline_password
          POSTGRES_DB: app_pipeline_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_pipeline_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app_pipeline_user:app_pipeline_password@localhost:5432/app_pipeline_db
      COGNITO_REGION: eu-central-1
      COGNITO_USER_POOL_ID: placeholder
      COGNITO_APP_CLIENT_ID: placeholder
      CORS_ORIGINS: http://localhost:3000,https://application-pipeline.vercel.app

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # installs the Python version from backend/.python-version if needed
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v
